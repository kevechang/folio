name: Bug report
description: Report a reproducible problem in Folio.
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Folio revision or version, macOS version, and Mac architecture.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a small synthetic document if it helps reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include error messages or screenshots. Remove personal paths and private content.
    validations:
      required: true
