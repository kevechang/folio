name: Feature request
description: Suggest an improvement to Folio.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe what you want to accomplish.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed improvement
      description: Describe the desired behavior and any alternatives you considered.
    validations:
      required: true
